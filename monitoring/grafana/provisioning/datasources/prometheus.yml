apiVersion: 1
datasources:
  - name: KVStore Prometheus
    uid: kvstore-prometheus
    type: prometheus
    access: proxy
    url: ${KVSTORE_PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      manageAlerts: true
      prometheusType: Prometheus
